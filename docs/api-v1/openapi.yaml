openapi: "3.1.0"
info:
  title: "Sixxis CRM — API de Leitura v1"
  version: "v1"
  description: "API REST read-only do CRM. Autenticacao Bearer (sxc_live_...). Somente GET/HEAD/OPTIONS. Datas ISO 8601 UTC; dinheiro em string decimal BRL. Paginacao por cursor keyset. Erros em application/problem+json (RFC 9457)."
servers:
  -     url: "/api/v1"
security:
  -     bearerAuth: []
x-build:
  commit: "desconhecido"
  time: "2026-11-16T20:04:34.820Z"
tags:
  -     name: "meta"
  -     name: "clientes"
  -     name: "pedidos"
  -     name: "negocios"
  -     name: "conversas"
  -     name: "mensagens"
  -     name: "agentes"
  -     name: "produtos"
  -     name: "pagamentos"
  -     name: "campanhas"
  -     name: "tarefas"
  -     name: "metas"
  -     name: "analytics"
  -     name: "catalogo"
  -     name: "integracoes"
  -     name: "config"
  -     name: "supervisor"
  -     name: "oracle"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      description: "Chave de leitura 'sxc_live_...'. Escopos: read:all (todos os recursos), granular read:<dominio>, read:pii (PII sem mascara), read:mensagens (conteudo de conversa)."
  schemas:
    MetaLista:
      type: "object"
      properties:
        requestId:
          type: "string"
        count:
          type: "integer"
        hasMore:
          type: "boolean"
        nextCursor:
          type:
            - "string"
            - "null"
        generatedAt:
          type: "string"
          format: "date-time"
        apiVersion:
          type: "string"
    MetaItem:
      type: "object"
      properties:
        requestId:
          type: "string"
        generatedAt:
          type: "string"
          format: "date-time"
        apiVersion:
          type: "string"
    Problema:
      type: "object"
      description: "Erro no formato RFC 9457."
      properties:
        type:
          type: "string"
        title:
          type: "string"
        status:
          type: "integer"
        detail:
          type: "string"
        instance:
          type: "string"
        requestId:
          type: "string"
      required:
        - "type"
        - "title"
        - "status"
    Me:
      type: "object"
      properties:
        nome:
          type: "string"
        prefixo:
          type: "string"
        escopos:
          type: "array"
          items:
            type: "string"
        expiraEm:
          type:
            - "string"
            - "null"
          format: "date-time"
